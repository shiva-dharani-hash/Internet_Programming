<!DOCTYPE html>
<html>
<head>
    <title>AJAX and XML - Orders</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: linen;
            margin: 0;
            padding: 40px;
        }

        .container {
            width: 90%;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        h1 {
            text-align: center;
            color: #800020;
        }

        p {
            text-align: center;
            color: #555;
        }

        button {
            display: block;
            margin: 20px auto;
            padding: 12px 25px;
            background-color: #800020;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #5c0017;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th {
            background-color: #800020;
            color: white;
            padding: 12px;
        }

        td {
            padding: 12px;
            text-align: center;
            border: 1px solid #d8b8b8;
            color: #4a1f1f;
        }

        tr:nth-child(even) {
            background-color: #f8e9e9;
        }

        tr:hover {
            background-color: #ead1d1;
        }

        #result {
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Online Shopping Orders</h1>

    <p>AJAX and XML Order Management</p>

    <button onclick="loadOrders()">Load Orders</button>

    <div id="result"></div>

</div>

<script>

function loadOrders() {

    var xhttp = new XMLHttpRequest();

    xhttp.onreadystatechange = function() {

        if (this.readyState == 4 && this.status == 200) {

            var xmlDoc = this.responseXML;

            var orders = xmlDoc.getElementsByTagName("order");

            var output = "<table>";

            output += "<tr>";
            output += "<th>Order ID</th>";
            output += "<th>Customer</th>";
            output += "<th>Product</th>";
            output += "<th>Quantity</th>";
            output += "<th>Price</th>";
            output += "</tr>";

            for (var i = 0; i < orders.length; i++) {

                var id =
                    orders[i].getElementsByTagName("id")[0]
                    .childNodes[0].nodeValue;

                var customer =
                    orders[i].getElementsByTagName("customer")[0]
                    .childNodes[0].nodeValue;

                var product =
                    orders[i].getElementsByTagName("product")[0]
                    .childNodes[0].nodeValue;

                var quantity =
                    orders[i].getElementsByTagName("quantity")[0]
                    .childNodes[0].nodeValue;

                var price =
                    orders[i].getElementsByTagName("price")[0]
                    .childNodes[0].nodeValue;

                output += "<tr>";
                output += "<td>" + id + "</td>";
                output += "<td>" + customer + "</td>";
                output += "<td>" + product + "</td>";
                output += "<td>" + quantity + "</td>";
                output += "<td>₹" + price + "</td>";
                output += "</tr>";
            }

            output += "</table>";

            document.getElementById("result").innerHTML = output;
        }
    };

    xhttp.open("GET", "orders.xml", true);
    xhttp.send();
}

</script>

</body>
</html>
