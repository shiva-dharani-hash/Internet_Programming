<html>

<head>
<title>ONLINE DRESS SHOPPING - REGISTRATION</title>
</head>

<body style="background-color:linen;">

<center>

<h1 style="color:maroon;font-style:italic;border:3px solid maroon;padding:10px;">
ONLINE DRESS SHOPPING
</h1>

<h2 style="color:navy;font-style:italic;">
REGISTRATION FORM
</h2>

<form>

<table border="1" cellpadding="10"
style="background-color:white;">

<tr>
<td style="color:darkblue;font-style:italic;"><b>First Name</b></td>
<td><input type="text" required></td>
</tr>

<tr>
<td style="color:darkblue;font-style:italic;"><b>Last Name</b></td>
<td><input type="text" required></td>
</tr>

<tr>
<td style="color:darkblue;font-style:italic;"><b>Gender</b></td>
<td>
<input type="radio" name="gender">Male
<input type="radio" name="gender">Female
</td>
</tr>

<tr>
<td style="color:darkblue;font-style:italic;"><b>Date of Birth</b></td>
<td><input type="date"></td>
</tr>

<tr>
<td style="color:darkblue;font-style:italic;"><b>Email</b></td>
<td><input type="email"></td>
</tr>

<tr>
<td style="color:darkblue;font-style:italic;"><b>Phone Number</b></td>
<td><input type="tel"></td>
</tr>

<tr>
<td style="color:darkblue;font-style:italic;"><b>Address</b></td>
<td><textarea rows="4" cols="25"></textarea></td>
</tr>

<tr>
<td style="color:darkblue;font-style:italic;"><b>City</b></td>
<td><input type="text"></td>
</tr>

<tr>
<td style="color:darkblue;font-style:italic;"><b>Pincode</b></td>
<td><input type="number"></td>
</tr>

<tr>
<td style="color:darkblue;font-style:italic;"><b>Username</b></td>
<td><input type="text"></td>
</tr>

<tr>
<td style="color:darkblue;font-style:italic;"><b>Password</b></td>
<td><input type="password"></td>
</tr>

<tr>
<td style="color:darkblue;font-style:italic;"><b>Confirm Password</b></td>
<td><input type="password"></td>
</tr>

<tr>
<td colspan="2" align="center">

<input type="submit" value="Register"
style="background-color:green;color:white;font-style:italic;">

<input type="reset" value="Clear"
style="background-color:red;color:white;font-style:italic;">

</td>
</tr>

</table>

</form>

<br>

<p style="color:maroon;font-style:italic;">
Already have an account?
<a href="Login.html">Login Here</a>
</p>

</center>

</body>

</html>
